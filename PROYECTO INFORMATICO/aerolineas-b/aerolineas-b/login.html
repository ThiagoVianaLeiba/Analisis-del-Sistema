<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - AerolineasLowCost</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>Iniciar sesión</h1>

        <form id="login-form">

            <div class="auth-group">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

            </div>


            <div class="auth-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Iniciar sesión
            </button>

        </form>


        <div class="auth-link">

            <p>
                ¿No tenés una cuenta?
                <a href="registro.html">
                    Registrarse
                </a>
            </p>

        </div>


        <div class="auth-link">

            <a href="index.html">
                Volver al inicio
            </a>

        </div>

    </div>

</div>


<script src="login.js"></script>

</body>

</html>
