<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registrarse - AerolineasLowCost</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>Crear cuenta</h1>


        <form id="registro-form">


            <div class="auth-group">

                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    required
                >

            </div>


            <div class="auth-group">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

            </div>


            <div class="auth-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >

            </div>


            <div class="auth-group">

                <label for="confirm-password">
                    Repetir contraseña
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Registrarse
            </button>

        </form>


        <div class="auth-link">

            <p>
                ¿Ya tenés una cuenta?
                <a href="login.html">
                    Iniciar sesión
                </a>
            </p>

        </div>


        <div class="auth-link">

            <a href="index.html">
                Volver al inicio
            </a>

        </div>

    </div>

</div>


<script src="registro.js"></script>

</body>

</html>
