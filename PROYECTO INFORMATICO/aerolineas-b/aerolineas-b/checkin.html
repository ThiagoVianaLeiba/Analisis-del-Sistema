<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Check-in - AerolineasLowCost</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">
        AerolineasLowCost
    </div>


    <nav>

        <a href="index.html">
            Buscar Vuelos
        </a>

        <a href="mis-viajes.html">
            Mis Viajes
        </a>

        <a href="checkin.html">

        </a>

        <a href="ayuda.html">
            Ayuda
        </a>

        <a href="mi-cuenta.html">

        </a>

    <div class="user-section">

            Iniciar sesión

            id="btn-logout"

        </button>

        <h1 class="page-title">
            Check-in

        -->

        <div id="boletos-list"></div>

<script src="check_in.js"></script>
